[package]
name = "lileum-reduction"
version = "0.1.0"
edition = "2024"
description = "Transcript implementation for Lileum"
repository = "https://github.com/LileumLabs/lileum"
license = "MIT OR Apache-2.0"

[dependencies]
ark-ff = { version = "0.4", default-features = false }
blake3 = { version = "1.8"}
ark-serialize = { version = "0.4", default-features = false, features = ["derive"] }
sponge = { workspace = true }

[dev-dependencies]
ark-vesta = "0.4"

[lib]
bench = false
