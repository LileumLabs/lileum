[package]
name = "lileum-sumcheck"
version = "0.1.0"
edition = "2024"
description = "generic Sumcheck implementation for Lileum"
repository = "https://github.com/LileumLabs/lileum"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ark-ff = "0.4"
reduction = { workspace = true }
sponge = { workspace = true }
